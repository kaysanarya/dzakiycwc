<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EFE9DE" />
    </linearGradient>
    <linearGradient id="sole-cut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2945D" />
      <stop offset="50%" stop-color="#D7A970" />
      <stop offset="100%" stop-color="#9C6F3A" />
    </linearGradient>
    <linearGradient id="side-leather" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#F2EDE3" />
      <stop offset="100%" stop-color="#DCD2BF" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAC7" />
      <stop offset="45%" stop-color="#E5C78F" />
      <stop offset="100%" stop-color="#A57F3A" />
    </linearGradient>
    <filter id="crisp-ground" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="16" result="blur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.22" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#cat-bg)" />

  <!-- Studio Ambient Cyclorama -->
  <line x1="0" y1="560" x2="800" y2="560" stroke="#E2DACD" stroke-width="1.5" />
  <ellipse cx="400" cy="570" rx="320" ry="20" fill="#2E2416" opacity="0.16" filter="blur(14px)" />

  <!-- True Lateral Profile Output (Preserving locked 85mm flared heel & square chisel toe) -->
  <g filter="url(#crisp-ground)" transform="translate(60, 20)">
    <path d="M 120 520 C 200 520 280 515 380 470 C 440 440 500 395 530 380 L 545 390 C 510 415 450 460 380 495 C 280 540 200 542 120 542 Z" fill="url(#sole-cut)" stroke="#8A5F2D" stroke-width="1.5" />

    <!-- 85mm Hourglass Flared Heel -->
    <path d="M 450 495 C 470 515 465 530 455 545 C 452 550 460 555 475 555 C 510 555 520 545 515 535 C 505 515 515 480 535 435 C 515 450 475 475 450 495 Z" fill="url(#side-leather)" stroke="#C8BCAB" stroke-width="1.5" />
    <rect x="455" y="550" width="38" height="8" rx="2" fill="#2A241C" />

    <!-- Upper Vamp -->
    <path d="M 120 520 C 120 480 150 460 210 460 C 265 460 310 485 330 515 C 270 525 190 526 120 520 Z" fill="url(#side-leather)" stroke="#D4C8B5" stroke-width="1.5" />
    <path d="M 130 512 C 160 472 260 470 315 508" fill="none" stroke="#BAAE9B" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Arch Strap with Buckle -->
    <path d="M 290 500 C 330 450 380 440 410 460 C 390 480 340 510 300 520 Z" fill="url(#side-leather)" stroke="#C8BCAB" stroke-width="1" />
    <rect x="345" y="448" width="22" height="30" rx="4" fill="url(#gold-grad)" stroke="#8A6729" stroke-width="1.5" transform="rotate(18 356 463)" />
  </g>

  <!-- Commercial Badge -->
  <g transform="translate(40, 720)">
    <rect width="210" height="36" rx="6" fill="#1C1917" opacity="0.9" />
    <circle cx="20" cy="18" r="4" fill="#3B82F6" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">CATALOG: Lateral Profile (97%)</text>
  </g>
</svg>
