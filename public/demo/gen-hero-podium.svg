<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="podium-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="60%" stop-color="#ECE3D5" />
      <stop offset="100%" stop-color="#DCD0BD" />
    </linearGradient>
    <linearGradient id="pod-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#F2EAE0" />
      <stop offset="100%" stop-color="#E2D6C6" />
    </linearGradient>
    <linearGradient id="leather-cream" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="40%" stop-color="#F4EFE6" />
      <stop offset="85%" stop-color="#E2D9C8" />
      <stop offset="100%" stop-color="#CEC2AE" />
    </linearGradient>
    <linearGradient id="gold-hardware" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE9C4" />
      <stop offset="35%" stop-color="#E3C48C" />
      <stop offset="70%" stop-color="#B88E4B" />
      <stop offset="100%" stop-color="#EED7A6" />
    </linearGradient>
    <filter id="cinematic-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="18" dy="26" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.32" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#podium-bg)" />

  <!-- Natural Sunlight Slant (Guided by Reference) -->
  <polygon points="0,0 260,0 520,800 0,800" fill="#FFFFFF" opacity="0.35" filter="blur(24px)" />

  <!-- Travertine Architectural Plinth (Photography Direction) -->
  <polygon points="180,510 580,510 520,620 120,620" fill="url(#pod-top)" stroke="#DDD3C3" stroke-width="2" />
  <polygon points="120,620 520,620 520,700 120,700" fill="#DDD0BC" stroke="#C8BBA5" />
  <polygon points="520,620 580,510 580,590 520,700" fill="#C5B69F" stroke="#B4A38A" />

  <!-- Contact Occlusion Shadow -->
  <ellipse cx="370" cy="515" rx="160" ry="22" fill="#241B10" opacity="0.35" filter="blur(10px)" />

  <!-- LOCKED PRODUCT: Exact Ivory Mule with 85mm Hourglass Heel & Chisel Toe -->
  <g filter="url(#cinematic-shadow)" transform="translate(45, 0)">
    <!-- Sole Profile -->
    <path d="M 220 500 C 260 505 350 512 430 495 C 470 485 510 445 520 405 C 522 395 505 390 495 400 C 470 435 430 460 380 470 C 310 480 240 480 215 482 Z" fill="#C2945D" stroke="#8A5F2D" stroke-width="1.5" />

    <!-- 85mm Hourglass Flared Heel -->
    <path d="M 445 470 C 455 490 450 515 440 535 C 438 540 445 545 460 545 C 485 545 495 538 490 530 C 480 510 492 485 505 450 C 490 455 460 462 445 470 Z" fill="url(#leather-cream)" stroke="#C8BCAB" stroke-width="1" />
    <path d="M 440 538 L 468 538 L 465 545 L 438 545 Z" fill="#2A241C" />

    <!-- Insole Bed & Debossed Branding -->
    <path d="M 220 485 C 270 490 350 495 425 475 C 475 460 505 425 500 395 C 490 390 465 420 420 445 C 360 470 290 475 220 485 Z" fill="#E8DEC9" stroke="#D1C3AB" stroke-width="1" />
    <text x="445" y="440" font-family="serif" font-size="10" font-weight="600" fill="#9C773B" letter-spacing="3" transform="rotate(-28 445 440)">HARVIE ATELIER</text>

    <!-- Main Leather Vamp with Locked Chisel Square Toe -->
    <path d="M 195 480 C 190 465 200 445 225 440 C 265 430 330 435 375 465 C 385 472 380 485 365 490 C 315 495 240 495 200 488 Z" fill="url(#leather-cream)" stroke="#D4C8B5" stroke-width="1.5" />
    <path d="M 205 474 C 235 448 310 446 362 475" fill="none" stroke="#BAAE9B" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Arch Strap with Locked Champagne Gold Buckle -->
    <path d="M 290 440 C 330 405 385 400 425 425 C 435 432 430 442 415 446 C 380 430 335 432 300 455 Z" fill="url(#leather-cream)" stroke="#C8BCAB" stroke-width="1" />
    <rect x="365" y="405" width="34" height="26" rx="6" fill="url(#gold-hardware)" stroke="#8A6729" stroke-width="1.5" transform="rotate(-15 380 418)" />
    <rect x="372" y="411" width="20" height="14" rx="3" fill="#E8DEC9" transform="rotate(-15 380 418)" />
    <line x1="382" y1="405" x2="382" y2="431" stroke="#8A6729" stroke-width="2.5" transform="rotate(-15 380 418)" />
  </g>

  <!-- Commercial Badge -->
  <g transform="translate(40, 720)">
    <rect width="220" height="36" rx="6" fill="#1C1917" opacity="0.9" />
    <circle cx="20" cy="18" r="4" fill="#8B5CF6" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">STUDIO: Plinth Hero (Demo)</text>
  </g>
</svg>
