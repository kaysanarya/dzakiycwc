<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="side-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="100%" stop-color="#EDE6D9" />
    </linearGradient>
    <linearGradient id="side-leather" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#F2EDE3" />
      <stop offset="100%" stop-color="#DCD2BF" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAC7" />
      <stop offset="45%" stop-color="#E5C78F" />
      <stop offset="100%" stop-color="#A57F3A" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#side-bg)" />
  <circle cx="400" cy="400" r="300" fill="#FFFFFF" opacity="0.5" filter="blur(30px)" />
  <ellipse cx="400" cy="560" rx="300" ry="25" fill="#2E2416" opacity="0.18" filter="blur(14px)" />

  <!-- True Lateral Profile -->
  <g transform="translate(60, 20)">
    <!-- Sole Profile Base -->
    <path d="M 120 520 C 200 520 280 515 380 470 C 440 440 500 395 530 380 L 545 390 C 510 415 450 460 380 495 C 280 540 200 542 120 542 Z" fill="#C2945D" stroke="#8A5F2D" stroke-width="1.5" />

    <!-- 85mm Hourglass Flared Heel -->
    <!-- Front Heel Line, Waist Curve, Flared Base -->
    <path d="M 450 495 C 470 515 465 530 455 545 C 452 550 460 555 475 555 C 510 555 520 545 515 535 C 505 515 515 480 535 435 C 515 450 475 475 450 495 Z" fill="url(#side-leather)" stroke="#C8BCAB" stroke-width="1.5" />
    <rect x="455" y="550" width="38" height="8" rx="2" fill="#2A241C" />

    <!-- Upper Vamp Profile -->
    <path d="M 120 520 C 120 480 150 460 210 460 C 265 460 310 485 330 515 C 270 525 190 526 120 520 Z" fill="url(#side-leather)" stroke="#D4C8B5" stroke-width="1.5" />
    <path d="M 130 512 C 160 472 260 470 315 508" fill="none" stroke="#BAAE9B" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Arch Strap Profile -->
    <path d="M 290 500 C 330 450 380 440 410 460 C 390 480 340 510 300 520 Z" fill="url(#side-leather)" stroke="#C8BCAB" stroke-width="1" />
    <!-- Gold Buckle on Arch Profile -->
    <rect x="345" y="448" width="22" height="30" rx="4" fill="url(#gold-grad)" stroke="#8A6729" stroke-width="1.5" transform="rotate(18 356 463)" />
  </g>

  <!-- Technical Spec Callout Overlays -->
  <g transform="translate(560, 480)">
    <line x1="0" y1="0" x2="-40" y2="20" stroke="#926F34" stroke-width="1.5" stroke-dasharray="2,2" />
    <rect x="0" y="-12" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#E2C48E" />
    <text x="8" y="4" font-family="sans-serif" font-size="10" font-weight="600" fill="#926F34">HEEL: 85mm Flared</text>
  </g>
  <g transform="translate(140, 420)">
    <line x1="30" y1="40" x2="60" y2="10" stroke="#926F34" stroke-width="1.5" stroke-dasharray="2,2" />
    <rect x="60" y="0" width="130" height="24" rx="4" fill="#FFFFFF" stroke="#E2C48E" />
    <text x="68" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#926F34">TOE: Chisel Square</text>
  </g>

  <g transform="translate(40, 720)">
    <rect width="180" height="36" rx="6" fill="#1C1917" opacity="0.85" />
    <circle cx="20" cy="18" r="4" fill="#22C55E" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">SOURCE: Side Profile</text>
  </g>
</svg>
