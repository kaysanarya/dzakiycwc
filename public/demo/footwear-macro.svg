<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="macro-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F2EDE4" />
      <stop offset="100%" stop-color="#E2D8C6" />
    </radialGradient>
    <linearGradient id="macro-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3DB" />
      <stop offset="25%" stop-color="#F2D79E" />
      <stop offset="60%" stop-color="#C79F52" />
      <stop offset="90%" stop-color="#9C7326" />
      <stop offset="100%" stop-color="#EED49E" />
    </linearGradient>
    <linearGradient id="macro-leather" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="50%" stop-color="#EFE8DC" />
      <stop offset="100%" stop-color="#DDD3C3" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#macro-bg)" />

  <!-- Macro Leather Strap Background with Stitching -->
  <path d="M 0 200 C 250 180 550 350 800 300 L 800 650 C 550 700 250 550 0 600 Z" fill="url(#macro-leather)" stroke="#C8BCAB" stroke-width="2" />

  <!-- Precision Stitching Macro Line -->
  <path d="M 20 230 C 260 210 540 370 780 325" fill="none" stroke="#A99C87" stroke-width="3" stroke-dasharray="8,8" />
  <path d="M 20 570 C 260 520 540 660 780 620" fill="none" stroke="#A99C87" stroke-width="3" stroke-dasharray="8,8" />

  <!-- Macro Champagne Gold Buckle Focus -->
  <g transform="translate(360, 420)">
    <!-- Shadow -->
    <rect x="-135" y="-105" width="270" height="210" rx="40" fill="#2E2416" opacity="0.22" filter="blur(16px)" />
    <!-- Outer Dual-Arch Frame -->
    <rect x="-130" y="-100" width="260" height="200" rx="36" fill="url(#macro-gold)" stroke="#8A6729" stroke-width="3" />
    <!-- Inner Cutout -->
    <rect x="-85" y="-60" width="170" height="120" rx="20" fill="url(#macro-leather)" stroke="#A6813B" stroke-width="2" />
    <!-- Center Tongue Prong -->
    <rect x="-12" y="-95" width="24" height="190" rx="10" fill="url(#macro-gold)" stroke="#8A6729" stroke-width="2" />
    <circle cx="0" cy="5" r="7" fill="#8A6729" />
  </g>

  <!-- Tag Indicator -->
  <g transform="translate(40, 720)">
    <rect width="210" height="36" rx="6" fill="#1C1917" opacity="0.85" />
    <circle cx="20" cy="18" r="4" fill="#22C55E" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">SOURCE: Buckle Macro</text>
  </g>
</svg>
