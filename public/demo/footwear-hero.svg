<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#EBE4D8" />
    </linearGradient>
    <radialGradient id="podium-top" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#ECE5DA" />
      <stop offset="100%" stop-color="#DDD3C3" />
    </radialGradient>
    <linearGradient id="leather-cream" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="40%" stop-color="#F4EFE6" />
      <stop offset="85%" stop-color="#E2D9C8" />
      <stop offset="100%" stop-color="#CEC2AE" />
    </linearGradient>
    <linearGradient id="gold-hardware" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE9C4" />
      <stop offset="35%" stop-color="#E3C48C" />
      <stop offset="70%" stop-color="#B88E4B" />
      <stop offset="100%" stop-color="#EED7A6" />
    </linearGradient>
    <linearGradient id="sole-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2945D" />
      <stop offset="50%" stop-color="#D7A970" />
      <stop offset="100%" stop-color="#9C6F3A" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-grad)" />

  <!-- Studio Ambient Lighting Grid / Vignette -->
  <circle cx="400" cy="380" r="320" fill="#FFFFFF" opacity="0.45" filter="blur(40px)" />

  <!-- Ground Podia -->
  <ellipse cx="400" cy="580" rx="280" ry="60" fill="#000000" opacity="0.12" filter="blur(18px)" />
  <ellipse cx="400" cy="570" rx="260" ry="46" fill="url(#podium-top)" stroke="#DDD3C3" stroke-width="2" />

  <!-- Shoe Drop Shadow -->
  <ellipse cx="400" cy="530" rx="190" ry="24" fill="#2E2416" opacity="0.28" filter="blur(12px)" />

  <!-- Footwear Object (Hero 3/4 Front) -->
  <g filter="url(#soft-shadow)" transform="translate(40, -10)">
    <!-- Sole / Outsole Profile -->
    <path d="M 220 500 C 260 505 350 512 430 495 C 470 485 510 445 520 405 C 522 395 505 390 495 400 C 470 435 430 460 380 470 C 310 480 240 480 215 482 Z" fill="url(#sole-wood)" stroke="#8A5F2D" stroke-width="1.5" />

    <!-- 85mm Sculpted Hourglass Block Heel -->
    <path d="M 445 470 C 455 490 450 515 440 535 C 438 540 445 545 460 545 C 485 545 495 538 490 530 C 480 510 492 485 505 450 C 490 455 460 462 445 470 Z" fill="url(#leather-cream)" stroke="#C8BCAB" stroke-width="1" />
    <path d="M 440 538 L 468 538 L 465 545 L 438 545 Z" fill="#2A241C" /> <!-- Rubber heel tip -->

    <!-- Insole Bed -->
    <path d="M 220 485 C 270 490 350 495 425 475 C 475 460 505 425 500 395 C 490 390 465 420 420 445 C 360 470 290 475 220 485 Z" fill="#E8DEC9" stroke="#D1C3AB" stroke-width="1" />

    <!-- Insole Gold Wordmark -->
    <text x="445" y="440" font-family="serif" font-size="10" font-weight="600" fill="#9C773B" letter-spacing="3" transform="rotate(-28 445 440)">HARVIE ATELIER</text>

    <!-- Main Leather Vamp (Square Toe Front) -->
    <path d="M 195 480 C 190 465 200 445 225 440 C 265 430 330 435 375 465 C 385 472 380 485 365 490 C 315 495 240 495 200 488 Z" fill="url(#leather-cream)" stroke="#D4C8B5" stroke-width="1.5" />

    <!-- Vamp Stitching Detail -->
    <path d="M 205 474 C 235 448 310 446 362 475" fill="none" stroke="#BAAE9B" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Secondary Arch Strap with Champagne Gold Buckle -->
    <path d="M 290 440 C 330 405 385 400 425 425 C 435 432 430 442 415 446 C 380 430 335 432 300 455 Z" fill="url(#leather-cream)" stroke="#C8BCAB" stroke-width="1" />

    <!-- Champagne Gold Cast Dual-Arch Buckle -->
    <rect x="365" y="405" width="34" height="26" rx="6" fill="url(#gold-hardware)" stroke="#8A6729" stroke-width="1.5" transform="rotate(-15 380 418)" />
    <rect x="372" y="411" width="20" height="14" rx="3" fill="#E8DEC9" transform="rotate(-15 380 418)" />
    <line x1="382" y1="405" x2="382" y2="431" stroke="#8A6729" stroke-width="2.5" transform="rotate(-15 380 418)" />
  </g>

  <!-- Spec / Angle Indicator Overlay -->
  <g transform="translate(40, 720)">
    <rect width="180" height="36" rx="6" fill="#1C1917" opacity="0.85" />
    <circle cx="20" cy="18" r="4" fill="#22C55E" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" font-weight="500" fill="#FFFFFF">SOURCE: Hero 3/4</text>
  </g>
</svg>
