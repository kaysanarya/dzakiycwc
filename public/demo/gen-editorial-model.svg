<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="edit-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DD" />
      <stop offset="100%" stop-color="#DCD0BD" />
    </linearGradient>
    <linearGradient id="linen-pant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#EFE9DC" />
      <stop offset="100%" stop-color="#DFD6C4" />
    </linearGradient>
    <linearGradient id="skin-tone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEBD8" />
      <stop offset="100%" stop-color="#E5C7A6" />
    </linearGradient>
    <linearGradient id="leather-cream" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="40%" stop-color="#F4EFE6" />
      <stop offset="85%" stop-color="#E2D9C8" />
      <stop offset="100%" stop-color="#CEC2AE" />
    </linearGradient>
    <linearGradient id="gold-hardware" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE9C4" />
      <stop offset="35%" stop-color="#E3C48C" />
      <stop offset="70%" stop-color="#B88E4B" />
      <stop offset="100%" stop-color="#EED7A6" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#edit-floor)" />

  <!-- Architectural Wall Shadow -->
  <polygon points="0,0 450,0 200,800 0,800" fill="#2E2416" opacity="0.08" />

  <!-- Model's Cropped Linen Pants (Styling / Context) -->
  <path d="M 330 0 L 320 280 C 320 290 330 300 350 300 L 460 300 C 475 300 485 290 480 280 L 450 0 Z" fill="url(#linen-pant)" stroke="#D4C8B5" stroke-width="2" />
  <!-- Pant Hem Stitch -->
  <line x1="330" y1="285" x2="475" y2="285" stroke="#C5B69F" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Elegant Ankle Curve -->
  <path d="M 360 295 C 360 350 380 410 405 440 C 430 435 445 370 445 295 Z" fill="url(#skin-tone)" />

  <!-- Cast Shadow on Travertine Floor -->
  <ellipse cx="380" cy="565" rx="190" ry="24" fill="#2E2416" opacity="0.25" filter="blur(14px)" />

  <!-- THE LOCKED PRODUCT ON FOOT (Identity Perfectly Maintained) -->
  <g transform="translate(60, 40)">
    <!-- Sole -->
    <path d="M 180 500 C 240 505 330 510 400 490 C 440 480 470 440 480 405 C 475 395 460 395 450 405 C 425 435 390 455 350 465 C 280 475 200 475 180 480 Z" fill="#C2945D" stroke="#8A5F2D" stroke-width="1.5" />
    
    <!-- 85mm Flared Block Heel -->
    <path d="M 425 465 C 435 485 430 505 420 525 C 418 530 425 535 440 535 C 465 535 475 528 470 520 C 460 500 470 475 480 445 C 465 450 440 457 425 465 Z" fill="url(#leather-cream)" stroke="#C8BCAB" stroke-width="1" />
    <path d="M 420 528 L 448 528 L 445 535 L 418 535 Z" fill="#2A241C" />

    <!-- Square Chisel Toe Upper Vamp -->
    <path d="M 160 480 C 155 465 165 445 190 440 C 230 430 295 435 340 465 C 350 472 345 485 330 490 C 280 495 205 495 165 488 Z" fill="url(#leather-cream)" stroke="#D4C8B5" stroke-width="1.5" />
    <path d="M 170 474 C 200 448 275 446 325 475" fill="none" stroke="#BAAE9B" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Arch Strap with Locked Champagne Gold Buckle -->
    <path d="M 255 440 C 295 405 350 400 390 425 C 400 432 395 442 380 446 C 345 430 300 432 265 455 Z" fill="url(#leather-cream)" stroke="#C8BCAB" stroke-width="1" />
    <rect x="330" y="405" width="32" height="24" rx="5" fill="url(#gold-hardware)" stroke="#8A6729" stroke-width="1.5" transform="rotate(-15 345 417)" />
  </g>

  <!-- Commercial Badge -->
  <g transform="translate(40, 720)">
    <rect width="220" height="36" rx="6" fill="#1C1917" opacity="0.9" />
    <circle cx="20" cy="18" r="4" fill="#8B5CF6" />
    <text x="34" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">EDITORIAL: In-Context (Demo)</text>
  </g>
</svg>
